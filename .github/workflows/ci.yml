name: CI

on:
  push:
    branches: [main]
  pull_request:

# The module set is switchable without editing modules.config.ts (spec 4.1, 8.2): CMS_MODULES
# (comma-separated ids, empty = none) replaces the configured list at build and run time. Every
# job that builds or runs the app does it twice: with all modules (modules.config.ts, CMS_MODULES
# unset) and with none (CMS_MODULES=""). `select_modules` below exports the variable per leg.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine changed files
        id: changed
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # Fall back to the previous commit if the base isn't fetchable
          # (e.g. force-push, or the first commit on a new branch).
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi

          {
            echo "files<<BIOME_FILES_EOF"
            if [ -n "$base" ]; then
              git diff --name-only --diff-filter=ACMR "$base" "${{ github.sha }}" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.json' '*.css'
            fi
            echo "BIOME_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Scoped to files changed in this PR/push, not the whole repo — same
      # rationale as .githooks/pre-commit: fix what you touch, don't block on
      # pre-existing repo-wide lint debt.
      - name: Run Biome on changed files
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "$CHANGED_FILES"
          if [ "${#files[@]}" -eq 0 ] || [ -z "${files[0]}" ]; then
            echo "No relevant files changed."
            exit 0
          fi
          npx biome check --no-errors-on-unmatched "${files[@]}"

      # The import boundaries of theme/ and src/modules/ (noRestrictedImports, CLAUDE.md) hold
      # for the whole tree, not only for changed files.
      - name: Check import boundaries
        run: |
          npx biome lint --only=style/noRestrictedImports \
            $(git ls-files 'src/modules/*.ts' 'src/modules/*.tsx' 'theme/*.ts' 'theme/*.tsx')

      - name: Type check
        run: npx tsc --noEmit

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # tests/vitest-global-setup.ts starts mailpit, minio and stripe-mock with testcontainers
      # (Docker is available on the runner) and one temp SQLite file shared by all test files;
      # --no-file-parallelism avoids "database is locked" (see .githooks/pre-commit).
      - name: Run unit tests
        run: npx vitest run --no-file-parallelism
        env:
          MAGIC_LINK_SECRET: test
          SMTP_HOST: localhost
          SMTP_FROM: test@example.com
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: testtest
          S3_BUCKET: test

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modules: [all, none]
    name: build (${{ matrix.modules }} modules)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The active set is fixed at build time (client bundle, routes, i18n catalog).
      - name: Build client and server
        run: |
          set -euo pipefail
          if [ "${{ matrix.modules }}" = "none" ]; then export CMS_MODULES=""; fi
          npm run build.client
          npm run build.server

  e2e:
    # Playwright 1.60 has no Chromium for Ubuntu 26.04, which ubuntu-latest now is.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        modules: [all, none]
    name: e2e (${{ matrix.modules }} modules)
    env:
      NODE_ENV: test
      APP_URL: http://localhost:5173
      APP_NAME: Community Management System
      MAGIC_LINK_SECRET: test
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: test@example.com
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: testtest
      S3_BUCKET: test
      STRIPE_SECRET_KEY: sk_test_123
      STRIPE_WEBHOOK_SECRET: whsec_test
      STRIPE_API_BASE_URL: http://localhost:12111
      TELEGRAM_BOT_TOKEN: test
      TELEGRAM_CHANNEL_ID: test
      ALTCHA_HMAC_KEY: test
      E2E_ALLOW_DB_WRITE: "true"
      # Each leg on its own port and database (playwright.config.ts reseeds DB_PATH). The
      # databases live outside the checkout, where the dev server neither watches nor scans them.
      E2E_PORT: ${{ matrix.modules == 'none' && '5186' || '5185' }}
      DB_PATH: /tmp/e2e-${{ matrix.modules }}.db
    # The same services as docker-compose.yml locally (and testcontainers in the unit tests).
    services:
      minio:
        image: ghcr.io/coollabsio/minio:latest
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: test
          MINIO_ROOT_PASSWORD: testtest
        command: server /data --console-address ":9001"

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 8025:8025
          - 1025:1025
        env:
          MP_MAX_MESSAGES: 5000
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1

      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Select the module set
        run: |
          # GITHUB_ENV makes it apply to every later step: the seeds, the dev server and the
          # Playwright fixtures (module specs skip themselves via requireModules).
          if [ "${{ matrix.modules }}" = "none" ]; then echo "CMS_MODULES=" >> "$GITHUB_ENV"; fi

      - name: Wait for services
        run: |
          set -euo pipefail

          wait_for_http() {
            local url="$1"
            local label="$2"
            for _ in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then
                echo "$label is ready"
                return 0
              fi
              sleep 2
            done
            echo "$label did not become ready" >&2
            exit 1
          }

          wait_for_port() {
            local host="$1"
            local port="$2"
            local label="$3"
            for _ in $(seq 1 30); do
              if (echo > "/dev/tcp/${host}/${port}") >/dev/null 2>&1; then
                echo "$label is ready"
                return 0
              fi
              sleep 2
            done
            echo "$label did not become ready" >&2
            exit 1
          }

          wait_for_http http://localhost:9000/minio/health/live minio
          wait_for_http http://localhost:8025/api/v1/messages?limit=1 mailpit
          wait_for_port localhost 12111 stripe-mock

      - name: Create MinIO bucket
        run: aws --endpoint-url http://localhost:9000 s3 mb s3://test
        env:
          AWS_DEFAULT_REGION: us-east-1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The demo seed (core plus each active module's `seed`) must work for every module set.
      - name: Demo seed
        run: npx tsx scripts/seed.ts --fresh
        env:
          DB_PATH: /tmp/demo-${{ matrix.modules }}.db

      - name: Run e2e tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.modules }}
          path: test-results/
          retention-days: 7

  build-image:
    needs: [lint, unit, build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_S3_BASE_URL=${{ vars.VITE_S3_BASE_URL }}
          tags: |
            ghcr.io/konkrad/cms:${{ github.sha }}
            ghcr.io/konkrad/cms:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
