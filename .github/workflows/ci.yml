name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine changed files
        id: changed
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # Fall back to the previous commit if the base isn't fetchable
          # (e.g. force-push, or the first commit on a new branch).
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi

          {
            echo "files<<BIOME_FILES_EOF"
            if [ -n "$base" ]; then
              git diff --name-only --diff-filter=ACMR "$base" "${{ github.sha }}" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.json' '*.css'
            fi
            echo "BIOME_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Scoped to files changed in this PR/push, not the whole repo — same
      # rationale as .githooks/pre-commit: fix what you touch, don't block on
      # pre-existing repo-wide lint debt. `theme/**`'s noRestrictedImports
      # boundary rule (see CLAUDE.md) still applies to any theme file touched.
      - name: Run Biome on changed files
        if: steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          mapfile -t files <<< "$CHANGED_FILES"
          if [ "${#files[@]}" -eq 0 ] || [ -z "${files[0]}" ]; then
            echo "No relevant files changed."
            exit 0
          fi
          npx biome check --no-errors-on-unmatched "${files[@]}"

  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NODE_ENV: test
      APP_URL: http://localhost:5173
      APP_NAME: Community Management System
      MAGIC_LINK_SECRET: test
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: test@example.com
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: testtest
      S3_BUCKET: test
      S3_BASE_URL: http://localhost:9000/test
      STRIPE_SECRET_KEY: sk_test_123
      STRIPE_PUBLISHABLE_KEY: pk_test_123
      STRIPE_WEBHOOK_SECRET: whsec_test
      STRIPE_API_BASE_URL: http://localhost:12111
      TELEGRAM_BOT_TOKEN: test
      TELEGRAM_CHANNEL_ID: test
      ALTCHA_HMAC_KEY: test
      E2E_ALLOW_DB_WRITE: "true"
    services:
      minio:
        image: ghcr.io/coollabsio/minio:latest
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: test
          MINIO_ROOT_PASSWORD: testtest
        command: server /data --console-address ":9001"

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 8025:8025
          - 1025:1025
        env:
          MP_MAX_MESSAGES: 5000
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1

      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for services
        run: |
          set -euo pipefail

          wait_for_http() {
            local url="$1"
            local label="$2"
            for _ in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then
                echo "$label is ready"
                return 0
              fi
              sleep 2
            done
            echo "$label did not become ready" >&2
            exit 1
          }

          wait_for_port() {
            local host="$1"
            local port="$2"
            local label="$3"
            for _ in $(seq 1 30); do
              if (echo > "/dev/tcp/${host}/${port}") >/dev/null 2>&1; then
                echo "$label is ready"
                return 0
              fi
              sleep 2
            done
            echo "$label did not become ready" >&2
            exit 1
          }

          wait_for_http http://localhost:9000/minio/health/live minio
          wait_for_http http://localhost:8025/api/v1/messages?limit=1 mailpit
          wait_for_port localhost 12111 stripe-mock

      - name: Create MinIO bucket
        run: aws --endpoint-url http://localhost:9000 s3 mb s3://test
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: testtest
          AWS_DEFAULT_REGION: us-east-1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # --no-file-parallelism: tests/vitest-global-setup.ts shares one SQLite
      # file across all test files; parallel workers can hit "database is
      # locked" on unrelated tests (see .githooks/pre-commit).
      - name: Run unit tests
        run: npx vitest run --no-file-parallelism

      - name: Seed database
        run: npx tsx scripts/seed.ts --fresh

      - name: Run e2e tests
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  build-image:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/konkrad/cms:${{ github.sha }}
            ghcr.io/konkrad/cms:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dev image for the theme/-folder-mapping workflow (see
      # docs/theme-development.md) — a deployment repo bind-mounts its own
      # theme/ over this image's and gets hot reload via the Vite dev server,
      # no core checkout or build step on their side.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/konkrad/cms:dev-${{ github.sha }}
            ghcr.io/konkrad/cms:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
