name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    services:
      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: test
          MINIO_ROOT_PASSWORD: testtest
        command: server /data --console-address ":9001"

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 8025:8025
          - 1025:1025
        env:
          MP_MAX_MESSAGES: 5000
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1

      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for services
        run: |
          set -euo pipefail

          wait_for_http() {
            local url="$1"
            local label="$2"
            for _ in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then
                echo "$label is ready"
                return 0
              fi
              sleep 2
            done
            echo "$label did not become ready" >&2
            exit 1
          }

          wait_for_port() {
            local host="$1"
            local port="$2"
            local label="$3"
            for _ in $(seq 1 30); do
              if (echo > "/dev/tcp/${host}/${port}") >/dev/null 2>&1; then
                echo "$label is ready"
                return 0
              fi
              sleep 2
            done
            echo "$label did not become ready" >&2
            exit 1
          }

          wait_for_http http://localhost:9000/minio/health/live minio
          wait_for_http http://localhost:8025/api/v1/messages?limit=1 mailpit
          wait_for_port localhost 12111 stripe-mock

      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          APP_URL: http://localhost:5173
          APP_NAME: Digitalumni
          MAGIC_LINK_SECRET: test
          PHOTO_URL_SECRET: test
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_FROM: test@example.com
          AWS_REGION: us-east-1
          AWS_ENDPOINT: http://localhost:9000
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: testtest
          S3_BUCKET: test
          STRIPE_SECRET_KEY: sk_test_123
          STRIPE_PUBLISHABLE_KEY: pk_test_123
          STRIPE_WEBHOOK_SECRET: whsec_test
          STRIPE_API_BASE_URL: http://localhost:12111
          TELEGRAM_BOT_TOKEN: test
          TELEGRAM_CHANNEL_ID: test
          PUBLIC_MAPBOX_ACCESS_TOKEN: test
          ALTCHA_HMAC_KEY: test
          E2E_ALLOW_DB_WRITE: "true"
