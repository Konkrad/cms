# TEMPORARY: diagnoses the dev server crash ("Bus error (core dumped)") in the e2e job of
# ci.yml. Runs the all-modules e2e leg on Node 24 and 26 with core dumps enabled and prints
# the native stack of any crash. Delete this file once the cause is fixed.
name: e2e diagnostic

on:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e-diagnostic:
    # Playwright 1.60 has no Chromium for Ubuntu 26.04, which ubuntu-latest now is.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        modules: [all]
        node: [24, 26]
    name: e2e diagnostic (node ${{ matrix.node }})
    env:
      NODE_ENV: test
      APP_URL: http://localhost:5173
      APP_NAME: Community Management System
      MAGIC_LINK_SECRET: test
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: test@example.com
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: testtest
      S3_BUCKET: test
      STRIPE_SECRET_KEY: sk_test_123
      STRIPE_WEBHOOK_SECRET: whsec_test
      STRIPE_API_BASE_URL: http://localhost:12111
      TELEGRAM_BOT_TOKEN: test
      TELEGRAM_CHANNEL_ID: test
      ALTCHA_HMAC_KEY: test
      E2E_ALLOW_DB_WRITE: "true"
      # Each leg on its own port and database (playwright.config.ts reseeds DB_PATH).
      E2E_PORT: "5185"
      DB_PATH: ${{ github.workspace }}/e2e-${{ matrix.modules }}.db
    # The same services as docker-compose.yml locally (and testcontainers in the unit tests).
    services:
      minio:
        image: ghcr.io/coollabsio/minio:latest
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: test
          MINIO_ROOT_PASSWORD: testtest
        command: server /data --console-address ":9001"

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 8025:8025
          - 1025:1025
        env:
          MP_MAX_MESSAGES: 5000
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1

      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Select the module set
        run: |
          # GITHUB_ENV makes it apply to every later step: the seeds, the dev server and the
          # Playwright fixtures (module specs skip themselves via requireModules).
          if [ "${{ matrix.modules }}" = "none" ]; then echo "CMS_MODULES=" >> "$GITHUB_ENV"; fi

      - name: Wait for services
        run: |
          set -euo pipefail

          wait_for_http() {
            local url="$1"
            local label="$2"
            for _ in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null; then
                echo "$label is ready"
                return 0
              fi
              sleep 2
            done
            echo "$label did not become ready" >&2
            exit 1
          }

          wait_for_port() {
            local host="$1"
            local port="$2"
            local label="$3"
            for _ in $(seq 1 30); do
              if (echo > "/dev/tcp/${host}/${port}") >/dev/null 2>&1; then
                echo "$label is ready"
                return 0
              fi
              sleep 2
            done
            echo "$label did not become ready" >&2
            exit 1
          }

          wait_for_http http://localhost:9000/minio/health/live minio
          wait_for_http http://localhost:8025/api/v1/messages?limit=1 mailpit
          wait_for_port localhost 12111 stripe-mock

      - name: Create MinIO bucket
        run: aws --endpoint-url http://localhost:9000 s3 mb s3://test
        env:
          AWS_DEFAULT_REGION: us-east-1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The demo seed (core plus each active module's `seed`) must work for every module set.
      - name: Demo seed
        run: npx tsx scripts/seed.ts --fresh
        env:
          DB_PATH: ${{ github.workspace }}/demo-${{ matrix.modules }}.db

      # Core dumps: if the dev server dies (CI showed "Bus error (core dumped)"), keep the
      # dump so the next step can print the native stack.
      - name: Run e2e tests (core dumps on)
        run: |
          sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
          ulimit -c unlimited
          npx playwright test

      - name: Crash diagnostics
        if: failure()
        run: |
          set +e
          ls -la /tmp/core.* "$DB_PATH"* 2>&1
          sudo dmesg | tail -40
          if ls /tmp/core.* >/dev/null 2>&1; then
            sudo apt-get install -y -qq gdb >/dev/null
            for c in /tmp/core.*; do
              echo "===== $c"
              sudo gdb -batch -ex "info sharedlibrary" -ex "thread apply all bt 40" "$(which node)" "$c" 2>&1 \
                | grep -vE "^\[New LWP|^warning:" | head -400
            done
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-diagnostic-node${{ matrix.node }}
          path: test-results/
          retention-days: 7

