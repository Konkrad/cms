# Kamal deployment config. Fill in every <PLACEHOLDER> before deploying.
# Secret *values* live in .kamal/secrets (git-ignored); this file only names them.
# First deploy:  kamal setup   |  Subsequent:  kamal deploy
service: cms

# Image repository WITHOUT the registry host (Kamal prepends registry.server below).
# e.g. for ghcr.io/acme/cms -> use acme/cms
image: <OWNER>/cms

servers:
  web:
    - <SERVER_IP>

# Kamal's built-in proxy terminates TLS (auto Let's Encrypt) and routes to the app.
proxy:
  ssl: true
  host: <DOMAIN>            # DNS A record must point to <SERVER_IP>
  app_port: 3000
  healthcheck:
    path: /up
    interval: 5
    timeout: 5

registry:
  server: ghcr.io
  username: <REGISTRY_USERNAME>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  args:
    # Build-time: compiled into the client bundle. Public base URL of the S3 bucket.
    VITE_S3_BASE_URL: https://<PUBLIC_BUCKET_BASE_URL>

# Persistent volume for the SQLite file (+ WAL/SHM). Survives deploys; Litestream
# replicates it to the bucket for disaster recovery.
volumes:
  - "cms_data:/data"

env:
  clear:
    NODE_ENV: production
    PORT: "3000"
    APP_URL: https://<DOMAIN>
    ORIGIN: https://<DOMAIN>          # used by the node server for CSRF/origin checks
    APP_NAME: Digitalumni
    DB_PATH: /data/db.sqlite
    AWS_REGION: <S3_REGION>
    AWS_ENDPOINT: https://<S3_ENDPOINT>   # e.g. https://s3.<region>.io.cloud.ovh.net
    S3_BUCKET: <S3_BUCKET>
    S3_UPLOAD_PATH: public
    SMTP_HOST: <SMTP_HOST>
    SMTP_PORT: "587"
    SMTP_FROM: <FROM_EMAIL>
  secret:
    - MAGIC_LINK_SECRET
    - SMTP_USER
    - SMTP_PASS
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - STRIPE_SECRET_KEY
    - STRIPE_PUBLISHABLE_KEY
    - STRIPE_WEBHOOK_SECRET
    - TELEGRAM_BOT_TOKEN
    - TELEGRAM_CHANNEL_ID
    - PUBLIC_MAPBOX_ACCESS_TOKEN
    - ALTCHA_HMAC_KEY

# Convenience: `kamal console`, `kamal migrate`, `kamal logs`
aliases:
  console: app exec -i --reuse "sh"
  migrate: app exec --reuse "node scripts/migrate.js"
  logs: app logs -f
