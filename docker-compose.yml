services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-20-bullseye
    container_name: cms-app
    volumes:
      # This mounts your local folder into the container
      - .:/workspace:cached
    # Keep the container running in the background
    command: sleep infinity
    # Expose the dev server port so Codespaces can forward it cleanly
    ports:
      - 5173:5173
    # Ensures the app can talk to other services by name (e.g., http://mailpit:8025)
    networks:
      - cms-network

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    networks:
      - cms-network
    volumes:
      - ./data/mailpit:/data
    ports:
      - 8025:8025
      - 1025:1025

  # S3-compatible storage (Floci, a local AWS emulator; any non-empty credentials).
  floci:
    image: floci/floci:2.5.0
    container_name: floci
    restart: unless-stopped
    networks:
      - cms-network
    volumes:
      - ./data/floci:/app/data
    ports:
      - 4566:4566
    environment:
      # Keep uploads across restarts (the image defaults to in-memory storage).
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data

  stripe-mock:
    image: stripe/stripe-mock:latest
    container_name: stripe-mock
    restart: unless-stopped
    networks:
      - cms-network
    ports:
      - 12111:12111

networks:
  cms-network:
    driver: bridge