services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-20-bullseye
    container_name: cms-app
    volumes:
      # This mounts your local folder into the container
      - .:/workspace:cached
    # Keep the container running in the background
    command: sleep infinity
    # Expose the dev server port so Codespaces can forward it cleanly
    ports:
      - 5173:5173
    # Ensures the app can talk to other services by name (e.g., http://mailpit:8025)
    networks:
      - cms-network

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    networks:
      - cms-network
    volumes:
      - ./data/mailpit:/data
    ports:
      - 8025:8025
      - 1025:1025

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    networks:
      - cms-network
    volumes:
      - ./data/minio:/data
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: testtest
    command: server /data --console-address ":9001"

  stripe-mock:
    image: stripe/stripe-mock:latest
    container_name: stripe-mock
    restart: unless-stopped
    networks:
      - cms-network
    ports:
      - 12111:12111

networks:
  cms-network:
    driver: bridge